[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motec-log-generator"
version = "2.0.0"
description = "Convert motorsports telemetry logs to MoTeC LD/LDX files."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "BoYanZh" },
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
can = ["cantools>=39"]
fit = ["fitparse>=1.2"]
xrk = ["libxrk>=0.12"]
dev = [
  "cantools>=39",
  "fitparse>=1.2",
  "libxrk>=0.12",
  "pytest>=8",
]

[project.scripts]
motec-log = "motec_log_generator.cli:main"

[project.urls]
Repository = "https://github.com/BoYanZh/MotecLogGenerator"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motec_log_generator._vendor" = ["LDParser.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
